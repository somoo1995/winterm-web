<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>webterm</title>
<!-- The Chrome app-mode window and taskbar icon follow this favicon (generated by tools/make_icon.py) -->
<link rel="icon" type="image/png" href="/static/favicon.png?v=109">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=109">
<meta name="theme-color" content="#1a1b26">
<!-- Once installed, the title bar disappears and the window buttons sit on the tab bar (Window Controls Overlay) -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- Sarasa Fixed K - a monospace where CJK:latin width is exactly 2:1 (web-font subset, unicode-range fetches
     only the needed slices). WezTerm embeds JetBrains Mono IN ITS BINARY, so the browser can't see it (it used
     to silently fall back to Consolas). -->
<!-- It's Fixed, NOT Mono - the difference is decisive in a terminal:
     Sarasa Mono  draws East Asian Ambiguous chars (circled digits, arrows, etc.) as FULL-width glyphs
     Sarasa Fixed draws the same chars HALF-width
     xterm.js/claude count these chars as 1 cell, so a full-width glyph overwrites the next cell
     (e.g. a circled-3 + "Oracle" clobbers into "Oracle", "<- for" into "<-for"). -->
<link rel="stylesheet" href="/static/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="/static/fonts/sarasa-fixed-k.css">
<link rel="stylesheet" href="/static/vendor/xterm.css?v=109">
<link rel="stylesheet" href="/static/app.css?v=109">
</head>
<body>
  <!-- Layout ported straight from the WezTerm tab bar:
       [mark]> [tabs...]>            [pane-number chips] [clock]
       colors and Powerline arrows match .wezterm.lua's format-tab-title / update-status -->
  <header id="tabbar">
    <!-- Phone only - instead of the PC's narrow tabs/chips, this slot holds a menu button and a big chip bar -->
    <button id="nav-menu" hidden aria-label="All tabs and panes">&equiv;</button>
    <div id="navchips"></div>
    <!-- This slot ported WezTerm's WORKSPACE BADGE (update-status left_status), but webterm has no workspace
         concept, so "default" was a hardcoded DEAD STRING (nothing in app.js touches it). Rather than spend
         86px on that string, shrink it to a terminal-prompt mark (30px) and give the rest to tab names (2026-09-09).
         In WCO mode you can DRAG THE WINDOW by this slot - it's a logo, so it's excluded from the no-drag list. -->
    <div id="ws-badge" title="webterm">&gt;_</div>
    <div id="tabs"></div>
    <!-- Vertical session-rail toggle (Alt+B). Turning the rail on hides this horizontal tab list and the pane chips. -->
    <button id="rail-toggle" title="Collapse/expand the session rail (Alt+B)">&#9636;</button>
    <button id="new-tab" title="New tab (Ctrl+T) - right-click to choose a folder">+</button>
    <div class="gap"></div>
    <div id="panechips"></div>
    <button id="install" hidden title="Install as an app on your home screen">&#10515; Install</button>
    <button id="nav-refit" hidden title="Refresh - fit to this screen and redraw">&#8635;</button>
    <button id="kb-toggle" hidden title="Collapse/expand the special-key bar">&#9000;</button>
    <span id="lag" hidden></span>
    <span id="offline" hidden>disconnected</span>
    <span id="clock"></span>
  </header>

  <!-- PC only: the vertical session rail (Alt+B, or the tab bar's rail button)
       With 10 tabs, the horizontal bar gives names only 6 chars - one tab's fixed cost is 65px
       (padding 22 + Powerline arrow 16 + dot/number/gap 27), so 650px is gone before any letters.
       Stood up vertically, `name - pane count - task title` all fit within 190px of width.
       The phone doesn't use this rail - the chip bar (#navchips) + drawer (#drawer) play that role. -->
  <aside id="rail" hidden></aside>

  <!-- The panes of one tab are laid out here in a grid -->
  <div id="panes"></div>

  <!-- Phone only: the special-key bar (characters are typed straight to the terminal by the phone's own keyboard) -->
  <!-- Phone: normally just a FAB shows; tapping it expands the special-key dock (without covering the terminal) -->
  <div id="pad" hidden></div>
  <!-- Reading scroll dock - shows only when the keyboard is off (= you're reading).
       Everything here operates xterm's SCROLLBACK, NOT keys sent to the terminal
       (sending PgUp as a key mostly does nothing in a shell/claude - see `scroll`/`bottom` in app.js). -->
  <div id="scrollpad" hidden>
    <button data-scroll="-1" aria-label="Page up">&#8670;</button>
    <button data-scroll="1" aria-label="Page down">&#8671;</button>
    <button data-scroll="end" aria-label="To the bottom">&#10515;</button>
  </div>
  <div id="send-form" hidden>
    <div id="cmd" contenteditable="true" data-ph="Compose here"></div>
  </div>

  <!-- Phone only: a drawer with the full tab/pane list. If the chip bar is "jump straight there",
       this is "see it all at a glance".
       The #new-tab and #install buttons are MOVED into here (.dw-foot) during phone init -
       cloning them would split their handlers in two. -->
  <div id="drawer" hidden>
    <div class="dw-panel">
      <div class="dw-head"><span>Tabs &middot; Panes</span><button id="dw-close" aria-label="Close">&#10005;</button></div>
      <div id="dw-list"></div>
      <div class="dw-foot"></div>
    </div>
  </div>

  <div id="menu" hidden>
    <button data-act="split-h">&#10133; New pane - to the right (Ctrl+])</button>
    <button data-act="split-v">&#10133; New pane - below (Ctrl+\)</button>
    <button data-act="zoom">&#9974; Toggle fullscreen for this pane (double-click - Alt+number)</button>
    <button data-act="rename-pane">Pane name (Ctrl+P)</button>
    <button data-act="rename">Rename tab (Ctrl+T)</button>
    <button data-act="newhere">New tab here</button>
    <!-- Merged the old "redraw" + "fit to this screen" (a pin toggle) into one. Both had the same symptom -
         "the screen is broken" - but three items made it unclear which to press. -->
    <button data-act="redraw">&#8635; Refresh - fit to this screen and redraw (Ctrl+Shift+R)</button>
    <button data-act="clear">Clear the screen (clear)</button>
    <button data-act="webgl">Sharpen (WebGL) on/off</button>
    <button data-act="close" class="danger">Close (Alt+X)</button>
  </div>

<script src="/static/vendor/xterm.js?v=109"></script>
<script src="/static/vendor/addon-fit.js?v=109"></script>
<script src="/static/vendor/addon-webgl.js?v=109"></script>
<script src="/static/vendor/addon-web-links.js?v=109"></script>
<script src="/static/app.js?v=109"></script>
<!-- Order matters: app.js must install the keyboard.js adapter (window.post, etc.) first -->
<script src="/static/kb-layout.js?v=109"></script>
<script src="/static/keyboard.js?v=109"></script>
<script>
  // Registered to satisfy the PWA install criteria. sw.js caches nothing (to avoid a cache incident).
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
