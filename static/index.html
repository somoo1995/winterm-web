<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>webterm</title>
<!-- Chrome 앱 모드 창·작업표시줄 아이콘은 이 favicon 을 따른다 (tools/make_icon.py 로 생성) -->
<link rel="icon" type="image/png" href="/static/favicon.png?v=109">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=109">
<meta name="theme-color" content="#1a1b26">
<!-- 설치하면 타이틀바가 사라지고 창 버튼만 탭바에 얹힌다(Window Controls Overlay) -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- Sarasa Mono K — 한글:영문 폭이 정확히 2:1 인 고정폭(웹폰트 서브셋, unicode-range 로 필요한 조각만 받는다).
     WezTerm 은 JetBrains Mono 를 **바이너리에 내장**해 쓰므로 브라우저는 그걸 볼 수 없다(→ 예전엔 조용히 Consolas 로 폴백). -->
<!-- ⚠ Mono 가 아니라 **Fixed** 다. 둘의 차이가 터미널에서 결정적이다:
     Sarasa Mono  = East Asian Ambiguous 문자(① · ← 등)를 **전각** 글리프로 그린다
     Sarasa Fixed = 같은 문자를 **반각**으로 그린다
     xterm.js·claude 는 이 문자들을 1칸으로 계산하므로, 전각 글리프를 쓰면
     글자가 옆 칸을 덮어쓴다(`③ Oracle`→`③racle`, `← for`→`←for`). -->
<link rel="stylesheet" href="/static/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="/static/fonts/sarasa-fixed-k.css">
<link rel="stylesheet" href="/static/vendor/xterm.css?v=109">
<link rel="stylesheet" href="/static/app.css?v=109">
</head>
<body>
  <!-- WezTerm 탭바를 그대로 옮긴 배치:
       [마크]▶ [탭들…]▶            [pane 번호칩] [시계]
       색·Powerline 화살표는 .wezterm.lua 의 format-tab-title / update-status 와 같은 값 -->
  <header id="tabbar">
    <!-- 폰 전용 — PC 의 좁은 탭/칩 대신 ≡(전체 목록)와 큰 칩바가 이 자리를 쓴다 -->
    <button id="nav-menu" hidden aria-label="탭·패널 전체 목록">≡</button>
    <div id="navchips"></div>
    <!-- ⭐ 원래 WezTerm 의 **워크스페이스 배지**(update-status 의 left_status)를 옮긴 자리인데,
         webterm 에는 워크스페이스 개념이 없어 `default` 가 하드코딩된 **죽은 문자열**이었다
         (app.js 에서 이 값을 건드리는 코드가 없다). 폭 86px 을 그 문자열에 쓰는 대신
         터미널 프롬프트 마크로 줄여 30px 만 쓰고, 남은 폭은 탭 이름에 준다(2026-09-09).
         ⚠ WCO 모드에서는 이 자리로 **창을 끌 수 있다** — 로고이므로 no-drag 목록에서 뺐다. -->
    <div id="ws-badge" title="webterm">&gt;_</div>
    <div id="tabs"></div>
    <!-- ▤ = 세로 세션 레일 토글(Alt+B). 레일을 켜면 이 가로 탭 목록과 오른쪽 pane 칩은 숨는다 -->
    <button id="rail-toggle" title="세션 레일 접기/펴기 (Alt+B)">▤</button>
    <button id="new-tab" title="새 탭 (Ctrl+T) · 우클릭하면 폴더 지정">+</button>
    <div class="gap"></div>
    <div id="panechips"></div>
    <button id="install" hidden title="홈 화면에 앱으로 설치">⤓ 설치</button>
    <button id="nav-refit" hidden title="새로고침 — 이 화면에 맞추고 다시 그리기">↻</button>
    <button id="kb-toggle" hidden title="특수키 바 접기/펴기">⌨</button>
    <span id="lag" hidden></span>
    <span id="offline" hidden>연결 끊김</span>
    <span id="clock"></span>
  </header>

  <!-- ── PC 전용: 세로 세션 레일 (Alt+B · 탭바의 ▤) ──
       탭이 10개면 가로 탭바는 이름에 6자밖에 못 준다 — 탭 하나의 고정 비용이
       65px(패딩 22 + Powerline 화살표 16 + 점·번호·gap 27)이라 글자 들어가기 전에 650px 이 나간다.
       세로로 세우면 폭 190px 안에 `이름 · pane 수 · 작업 제목`이 다 들어간다.
       ⚠ 폰은 이 레일을 쓰지 않는다 — 칩바(#navchips) + 드로어(#drawer)가 같은 역할이다. -->
  <aside id="rail" hidden></aside>

  <!-- 한 탭 안의 pane 들이 여기에 grid 로 배치된다 -->
  <div id="panes"></div>

  <!-- ── 폰 전용: 특수키 바 (문자는 폰 기본 키보드가 터미널에 직접 친다) ── -->
  <!-- 폰: 평소엔 FAB 만 떠 있고, 누르면 특수키 도크가 펼쳐진다(터미널을 안 가린다) -->
  <div id="pad" hidden></div>
  <!-- 읽기용 스크롤 도크 — 키보드가 꺼져 있을 때(=읽는 중)만 뜬다.
       ⚠ 여기 있는 것은 전부 **터미널로 가는 키가 아니라 xterm 의 스크롤백 조작**이다
         (PgUp 을 키로 보내면 셸·claude 는 대개 무반응이다 — app.js 의 `scroll`/`bottom` 참조). -->
  <div id="scrollpad" hidden>
    <button data-scroll="-1" aria-label="한 페이지 위">⇞</button>
    <button data-scroll="1" aria-label="한 페이지 아래">⇟</button>
    <button data-scroll="end" aria-label="맨 아래로">⤓</button>
  </div>
  <div id="send-form" hidden>
    <div id="cmd" contenteditable="true" data-ph="한글은 여기서 조합됩니다"></div>
  </div>

  <!-- 폰 전용: 탭·패널 전체 목록 드로어. 칩바가 "바로 이동"이라면 이쪽은 "한눈에 보기"다.
       ⚠ `#new-tab` · `#install` 버튼은 폰 초기화에서 이 안(.dw-foot)으로 **옮겨온다** —
         복제하면 핸들러가 둘로 갈라진다. -->
  <div id="drawer" hidden>
    <div class="dw-panel">
      <div class="dw-head"><span>탭 · 패널</span><button id="dw-close" aria-label="닫기">✕</button></div>
      <div id="dw-list"></div>
      <div class="dw-foot"></div>
    </div>
  </div>

  <div id="menu" hidden>
    <button data-act="split-h">➕ 새 패널 — 오른쪽에 (Ctrl+])</button>
    <button data-act="split-v">➕ 새 패널 — 아래에 (Ctrl+\)</button>
    <button data-act="zoom">⛶ 이 패널 전체화면 토글 (더블클릭 · Alt+숫자)</button>
    <button data-act="rename-pane">패널 이름 (Ctrl+P)</button>
    <button data-act="rename">탭 이름 변경 (Ctrl+T)</button>
    <button data-act="newhere">여기서 새 탭</button>
    <!-- ⭐ 예전의 `↻ 다시 그리기` + `⤢ 이 화면에 맞추기`(고정 토글) 를 하나로 합쳤다.
         증상은 둘 다 "화면이 깨졌다" 하나인데 항목이 셋이라 뭘 눌러야 할지 알 수 없었다. -->
    <button data-act="redraw">↻ 새로고침 — 이 화면에 맞추고 다시 그리기 (Ctrl+Shift+R)</button>
    <button data-act="clear">화면 비우기 (clear)</button>
    <button data-act="webgl">선명하게(WebGL) 켜기·끄기</button>
    <button data-act="close" class="danger">닫기 (Alt+X)</button>
  </div>

<script src="/static/vendor/xterm.js?v=109"></script>
<script src="/static/vendor/addon-fit.js?v=109"></script>
<script src="/static/vendor/addon-webgl.js?v=109"></script>
<script src="/static/vendor/addon-web-links.js?v=109"></script>
<script src="/static/app.js?v=109"></script>
<!-- ⚠ 순서 중요: app.js 가 keyboard.js 용 어댑터(window.post 등)를 먼저 깔아야 한다 -->
<script src="/static/kb-layout.js?v=109"></script>
<script src="/static/keyboard.js?v=109"></script>
<script>
  // PWA 설치 요건을 채우기 위한 등록. sw.js 는 아무것도 캐시하지 않는다(캐시 사고 방지).
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
